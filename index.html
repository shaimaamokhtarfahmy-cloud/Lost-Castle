<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الهروب من القلعة</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <!-- الواجهة العلوية -->
        <div id="hud">
            <div class="control-box">
                <label for="lesson-index">غرف القلعة:</label>
                <select id="lesson-index" onchange="jumpToLesson()"></select>
            </div>
            
            <div class="locks-status">
                الأقفال المتبقية: <span id="locks-left">0</span> 🔒
            </div>

            <button id="ask-btn" onclick="drawQuestion()">ابحث عن المفتاح 🗝️</button>
        </div>

        <!-- مشهد الباب ثلاثي الأبعاد -->
        <div id="castle-scene">
            <div id="door-frame">
                <!-- خلفية الغرفة التالية (تظهر عند فتح الباب) -->
                <div id="next-room-bg">🌟 ممر العبور 🌟</div>
                
                <!-- درفتي الباب -->
                <div id="left-door" class="door left-door"></div>
                <div id="right-door" class="door right-door"></div>
                
                <!-- الأقفال -->
                <div id="locks-container">
                    <!-- تتولد برمجياً -->
                </div>
            </div>
        </div>

        <!-- رسائل اللعبة -->
        <div id="feedback-message" class="hidden"></div>
    </div>

    <!-- المربع الحواري -->
    <div id="quiz-modal" class="hidden">
        <div class="modal-content">
            
            <!-- قسم الشرح (خريطة الهروب) -->
            <div id="lesson-section" class="hidden">
                <h2 id="lesson-title" style="color: #6c5ce7;"></h2>
                <div class="lesson-box">
                    <p id="lesson-text"></p>
                </div>
                <button id="understand-btn" onclick="showQuestion()" class="action-btn">قرأت الخريطة، افتح القفل! 🗝️</button>
            </div>
            
            <!-- قسم السؤال -->
            <div id="question-section" class="hidden">
                <p id="chapter-branch-label" class="badge"></p>
                <h3 id="question-counter"></h3>
                <h2 id="question-text"></h2>
                <div id="options"></div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
